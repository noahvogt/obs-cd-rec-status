name: Build and Release (Linux)

on:
  push:
    tags:
      - 'v*'
  # manual test builds: only uploads the build artifact, no release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$GITHUB_REF_NAME' does not match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          jq --arg version "$VERSION" '.version = $version' buildspec.json > buildspec.json.tmp
          mv buildspec.json.tmp buildspec.json
          echo "Building version $VERSION"

      - name: Install Flatpak & flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder patchelf
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Create Flatpak Manifest
        run: |
          cat <<EOF > plugin.json
          {
              "id": "com.obsproject.Studio.Plugin.CDRecStatus",
              "branch": "stable",
              "runtime": "com.obsproject.Studio",
              "runtime-version": "stable",
              "sdk": "org.freedesktop.Sdk//25.08",
              "build-extension": true,
              "build-options": {
                  "prefix": "/app/plugins/cd-rec-status",
                  "build-args": [
                      "--share=network"
                  ]
              },
              "modules": [
                  {
                      "name": "cd-rec-status",
                      "buildsystem": "simple",
                      "build-commands": [
                          "cmake -B build -G Ninja -DENABLE_FRONTEND_API=ON -DENABLE_QT=ON -DCMAKE_PREFIX_PATH=/app -DCMAKE_POLICY_VERSION_MINIMUM=3.5",
                          "cmake --build build"
                      ],
                      "sources": [
                          {
                              "type": "dir",
                              "path": "."
                          }
                      ]
                  }
              ]
          }
          EOF

      - name: Build Plugin in Flatpak Sandbox
        run: flatpak-builder --user --install-deps-from=flathub --force-clean --keep-build-dirs build-dir plugin.json

      - name: Package Artifacts
        run: |
          mkdir -p release_package/cd-rec-status/bin/64bit
          mkdir -p release_package/cd-rec-status/data

          find .flatpak-builder/build -name "cd-rec-status.so" -exec cp {} release_package/cd-rec-status/bin/64bit/ \;

          patchelf --force-rpath --set-rpath '$ORIGIN' release_package/cd-rec-status/bin/64bit/cd-rec-status.so

          cp -r data/* release_package/cd-rec-status/data/

          cd release_package
          tar -czvf ../cd-rec-status-linux-x86_64.tar.gz .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cd-rec-status-linux-x86_64
          path: cd-rec-status-linux-x86_64.tar.gz

  release:
    name: Create GitHub Release
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
